<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тихо. Кабинет</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:oklch(97.2% .012 70);--paper:oklch(99.2% .007 70);--ink:oklch(20% .025 50);--muted:oklch(52% .02 55);--line:oklch(89% .018 68);--hot:oklch(61% .18 34);--wash:oklch(94% .045 45);--green:oklch(66% .13 153);--greenwash:oklch(94% .04 153);--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Onest,system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{position:sticky;top:0;height:100vh;background:var(--paper);border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 28px}.mark{width:40px;height:40px;border-radius:14px;background:var(--hot);color:var(--paper);display:grid;place-items:center;font-size:20px}.brand b{font-size:21px;letter-spacing:-.05em}.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.nav{display:grid;gap:5px}.nav button{min-height:48px;border:0;border-radius:15px;background:transparent;color:var(--muted);padding:0 14px;text-align:left;font-weight:700;transition:transform 130ms var(--ease),background 200ms var(--ease)}.nav button.active{background:var(--ink);color:var(--paper)}.nav button:active,.btn:active,.switch:active{transform:scale(.95)}main{max-width:1200px;width:100%;padding:34px clamp(18px,4vw,58px) 90px}.view{display:none}.view.active{display:block;animation:in 450ms var(--ease) both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:30px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--hot);font-weight:800}h1{font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-.06em;margin:4px 0 6px}header p{margin:0;color:var(--muted)}.btn{min-height:46px;border:0;border-radius:15px;padding:0 18px;background:var(--hot);color:var(--paper);font-weight:800;box-shadow:0 10px 24px oklch(61% .18 34/.22);transition:transform 130ms var(--ease)}.stats{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:26px}.stat{background:var(--paper);padding:24px;min-height:130px}.stat:first-child{background:var(--hot);color:var(--paper)}.stat small{display:block;color:var(--muted);margin-bottom:17px}.stat:first-child small{color:oklch(94% .03 45)}.stat strong{font-size:34px;letter-spacing:-.05em}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:8px 21px}.row{display:grid;grid-template-columns:76px 1fr 1fr auto;gap:15px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{display:block}.row small{color:var(--muted)}.badge{padding:7px 10px;border-radius:99px;background:var(--greenwash);color:oklch(43% .12 150);font-size:12px;font-weight:800}.service{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.service:last-child{border:0}.switch{width:52px;height:30px;border:0;border-radius:99px;padding:4px;background:var(--line);transition:transform 130ms var(--ease),background 200ms var(--ease)}.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 3px 8px oklch(30% .03 45/.18);transition:transform 260ms var(--ease)}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(22px)}.fields{display:grid;gap:16px;max-width:600px}.field{display:grid;gap:7px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field select{min-height:50px;border:1px solid var(--line);border-radius:15px;background:var(--bg);padding:0 14px;font:inherit}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--paper);padding:13px 17px;border-radius:14px;opacity:0;transform:translateY(15px);transition:all 250ms var(--ease)}.toast.show{opacity:1;transform:none}.bottom{display:none}@media(max-width:760px){.app{display:block}.side{display:none}main{padding:24px 15px 95px}.stats{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:1/-1}.row{grid-template-columns:60px 1fr auto}.row>*:nth-child(3){display:none}.bottom{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--ink);padding:7px;border-radius:19px}.bottom button{height:48px;border:0;border-radius:12px;background:transparent;color:oklch(75% .02 50);font:700 12px Onest}.bottom button.active{background:var(--hot);color:var(--paper)}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">✦</div><div><b>тихо.</b><small>кабинет владельца</small></div></div><nav class="nav"><button class="active" data-view="today">Сегодня</button><button data-view="services">Услуги</button><button data-view="settings">Настройки</button></nav></aside><main><section class="view active" id="today"><header><div><div class="eyebrow" id="date">Сегодня</div><h1>День под контролем</h1><p>Записи обновляются прямо из Telegram.</p></div><button class="btn" onclick="loadAll();say('Обновлено')">Обновить</button></header><div class="stats"><div class="stat"><small>Выручка сегодня</small><strong id="revenue">0 ₽</strong></div><div class="stat"><small>Записей</small><strong id="count">0</strong></div><div class="stat"><small>Автоматизация</small><strong id="automation">78%</strong></div></div><div class="panel" id="bookings"><div class="row"><span></span><b>Загрузка...</b></div></div></section><section class="view" id="services"><header><div><div class="eyebrow">Каталог</div><h1>Услуги</h1><p>Отключённые услуги сразу исчезают у клиентов.</p></div></header><div class="panel" id="serviceList"></div></section><section class="view" id="settings"><header><div><div class="eyebrow">Правила</div><h1>Настройки</h1><p>Сохраняются сразу после выбора.</p></div></header><div class="panel fields"><div class="field"><label>Удерживать выбранный слот</label><select data-key="hold_minutes"><option value="5">5 минут</option><option value="10">10 минут</option><option value="15">15 минут</option></select></div><div class="field"><label>Минимум до записи</label><select data-key="minimum_notice_hours"><option value="2">2 часа</option><option value="4">4 часа</option><option value="24">1 день</option></select></div><div class="field"><label>Напоминать заранее</label><select data-key="reminder_hours"><option value="24">За 24 часа</option><option value="12">За 12 часов</option><option value="2">За 2 часа</option></select></div></div></section></main><nav class="bottom"><button class="active" data-view="today">Сегодня</button><button data-view="services">Услуги</button><button data-view="settings">Настройки</button></nav></div><div class="toast" id="toast"></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const rub=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';let timer;function say(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}async function json(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}function openView(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===id))}document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>openView(x.dataset.view));async function loadDashboard(){const d=await json('/api/dashboard');date.textContent=d.date;revenue.textContent=rub(d.revenue);count.textContent=d.count;automation.textContent=d.automation+'%';bookings.innerHTML=d.bookings.length?d.bookings.map(x=>`<div class="row"><b>${x.starts_at.slice(11,16)}</b><div><b>${x.customer_name}</b><small>${x.phone}</small></div><div><b>${x.service}</b><small>${x.staff}</small></div><span class="badge">${x.status==='confirmed'?'Подтверждена':'Отменена'}</span></div>`).join(''):'<div class="row"><span></span><b>Пока нет записей</b></div>'}async function loadServices(){const xs=await json('/api/services');serviceList.innerHTML=xs.map(x=>`<div class="service"><div><b>${x.name}</b><small>${x.duration} мин</small></div><b>${x.price?rub(x.price):'Бесплатно'}</b><button class="switch ${x.enabled?'on':''}" data-id="${x.id}"></button></div>`).join('');document.querySelectorAll('.switch').forEach(b=>b.onclick=async()=>{b.classList.toggle('on');await json('/api/services/'+b.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:b.classList.contains('on')})});tg?.HapticFeedback?.impactOccurred('light');say(b.classList.contains('on')?'Услуга включена':'Услуга скрыта')})}async function loadSettings(){const s=await json('/api/settings');document.querySelectorAll('select[data-key]').forEach(x=>{x.value=s[x.dataset.key]||x.value;x.onchange=async()=>{await json('/api/settings/'+x.dataset.key,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:x.value})});tg?.HapticFeedback?.notificationOccurred('success');say('Сохранено')}})}async function loadAll(){try{await Promise.all([loadDashboard(),loadServices(),loadSettings()])}catch(e){say('Не удалось загрузить данные')}}loadAll();
</script></body></html>
