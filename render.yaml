services:
  - type: web
    name: tiho-booking-bot-demo
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEMO_MODE
        value: true
      - key: DATABASE_PATH
        value: ./tiho.db
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
